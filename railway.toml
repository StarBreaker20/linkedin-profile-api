# Railway config-as-code (reproducible deploy). Railway builds from the Dockerfile; the
# container's own CMD (`sh -c "uvicorn ... --port ${PORT:-8000}"`) handles the port safely,
# so we deliberately do NOT override startCommand here (a bare `$PORT` override can fail to
# expand and crash the process).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
